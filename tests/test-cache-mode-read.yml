name: Test cacheMode read with disableFallback
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          cacheMode: read
          disableFallback: 'true'
          extraHashedContent: some-extra-content
      - name: Assert output set
        env:
          CS: ${{ steps.action.outputs.cache-hit-coursier }}
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME coursier: $CS"
          if [ "$OUTCOME" != "success" ]; then
            echo "FAIL: expected success"
            exit 1
          fi
          if [ "$CS" != "true" ] && [ "$CS" != "false" ]; then
            echo "FAIL: expected boolean coursier output"
            exit 1
          fi
          echo "PASS"
