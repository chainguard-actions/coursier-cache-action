name: Test cache mode read-only
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: cache
        uses: .
        with:
          job: test-cache-mode-read
          cacheMode: read
      - name: Assert cache-hit-coursier output is valid
        env:
          CACHE_HIT: ${{ steps.cache.outputs.cache-hit-coursier }}
        run: |
          echo "cache-hit-coursier: '$CACHE_HIT'"
          # In read mode, cache may or may not hit, but output should be valid
          if [ "$CACHE_HIT" = "true" ] || [ "$CACHE_HIT" = "false" ] || [ -z "$CACHE_HIT" ]; then
            echo "PASS: cache-hit-coursier is a valid value"
          else
            echo "FAIL: unexpected value for cache-hit-coursier: '$CACHE_HIT'"
            exit 1
          fi
