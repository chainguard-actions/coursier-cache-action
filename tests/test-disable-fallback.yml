name: Test disable fallback and ignore ammonite
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: cache
        uses: .
        with:
          job: test-disable-fallback
          disableFallback: 'true'
          ignoreAmmonite: 'true'
      - name: Assert cache-hit-coursier output is valid
        env:
          CACHE_HIT: ${{ steps.cache.outputs.cache-hit-coursier }}
        run: |
          echo "cache-hit-coursier: '$CACHE_HIT'"
          if [ "$CACHE_HIT" = "true" ] || [ "$CACHE_HIT" = "false" ] || [ -z "$CACHE_HIT" ]; then
            echo "PASS: cache-hit-coursier is a valid value"
          else
            echo "FAIL: unexpected value for cache-hit-coursier: '$CACHE_HIT'"
            exit 1
          fi
      - name: Assert cache-hit-ammonite output is empty (ammonite ignored)
        env:
          CACHE_HIT: ${{ steps.cache.outputs.cache-hit-ammonite }}
        run: |
          echo "cache-hit-ammonite: '$CACHE_HIT'"
          # When ignoreAmmonite is true, the ammonite cache output should be empty or false
          if [ "$CACHE_HIT" = "true" ] || [ "$CACHE_HIT" = "false" ] || [ -z "$CACHE_HIT" ]; then
            echo "PASS: cache-hit-ammonite is a valid value when ammonite is ignored"
          else
            echo "FAIL: unexpected value for cache-hit-ammonite: '$CACHE_HIT'"
            exit 1
          fi
