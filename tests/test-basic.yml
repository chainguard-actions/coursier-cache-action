name: Test basic usage
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
      - name: Assert coursier cache-hit output is a boolean
        env:
          ACTUAL: ${{ steps.action.outputs.cache-hit-coursier }}
        run: |
          echo "actual: $ACTUAL"
          if [ "$ACTUAL" != "true" ] && [ "$ACTUAL" != "false" ]; then
            echo "FAIL: expected 'true' or 'false'"
            exit 1
          fi
          echo "PASS"
