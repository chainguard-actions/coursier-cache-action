name: Test sub-directory root input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create a sub-directory with a build.sbt file
        run: |
          mkdir -p "$GITHUB_WORKSPACE/myproject/project"
          echo 'name := "myproject"' > "$GITHUB_WORKSPACE/myproject/build.sbt"
          echo 'sbt.version=1.9.7' > "$GITHUB_WORKSPACE/myproject/project/build.properties"
      - id: cache
        uses: .
        with:
          root: myproject
          job: test-subdir-root
      - name: Assert cache-hit-coursier output is valid
        env:
          CACHE_HIT: ${{ steps.cache.outputs.cache-hit-coursier }}
        run: |
          echo "cache-hit-coursier: '$CACHE_HIT'"
          if [ "$CACHE_HIT" = "true" ] || [ "$CACHE_HIT" = "false" ] || [ -z "$CACHE_HIT" ]; then
            echo "PASS: cache-hit-coursier is a valid value"
          else
            echo "FAIL: unexpected value for cache-hit-coursier: '$CACHE_HIT'"
            exit 1
          fi
      - name: Assert cache-hit-sbt-ivy2-cache output is valid
        env:
          CACHE_HIT: ${{ steps.cache.outputs.cache-hit-sbt-ivy2-cache }}
        run: |
          echo "cache-hit-sbt-ivy2-cache: '$CACHE_HIT'"
          if [ "$CACHE_HIT" = "true" ] || [ "$CACHE_HIT" = "false" ] || [ -z "$CACHE_HIT" ]; then
            echo "PASS: cache-hit-sbt-ivy2-cache is a valid value"
          else
            echo "FAIL: unexpected value for cache-hit-sbt-ivy2-cache: '$CACHE_HIT'"
            exit 1
          fi
