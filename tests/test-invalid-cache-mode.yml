name: Test invalid cacheMode fails
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          cacheMode: bogus
      - name: Assert action failed
        env:
          OUTCOME: ${{ steps.action.outcome }}
          CS: ${{ steps.action.outputs.cache-hit-coursier }}
        run: |
          echo "outcome: $OUTCOME coursier: '$CS'"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure for invalid cacheMode"
            exit 1
          fi
          if [ -n "$CS" ]; then
            echo "FAIL: no outputs expected when cacheMode is invalid"
            exit 1
          fi
          echo "PASS"
