name: Test ammonite scripts detected
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          root: tests/fixtures/ammonite-project
          ignoreJob: 'true'
          ignoreMatrix: 'true'
      - name: Assert ammonite output set
        env:
          CS: ${{ steps.action.outputs.cache-hit-coursier }}
          AMM: ${{ steps.action.outputs.cache-hit-ammonite }}
        run: |
          echo "coursier: $CS ammonite: $AMM"
          for v in "$CS" "$AMM"; do
            if [ "$v" != "true" ] && [ "$v" != "false" ]; then
              echo "FAIL: expected boolean output, got '$v'"
              exit 1
            fi
          done
          echo "PASS"
