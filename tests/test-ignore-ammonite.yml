name: Test ignoreAmmonite skips ammonite cache
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          root: tests/fixtures/ammonite-project
          ignoreAmmonite: 'true'
      - name: Assert ammonite output not set
        env:
          CS: ${{ steps.action.outputs.cache-hit-coursier }}
          AMM: ${{ steps.action.outputs.cache-hit-ammonite }}
        run: |
          echo "coursier: $CS ammonite: '$AMM'"
          if [ "$CS" != "true" ] && [ "$CS" != "false" ]; then
            echo "FAIL: expected boolean coursier output"
            exit 1
          fi
          if [ -n "$AMM" ]; then
            echo "FAIL: ammonite cache should be skipped when ignoreAmmonite is true"
            exit 1
          fi
          echo "PASS"
