name: Test custom cache path
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create custom cache directory
        run: mkdir -p "$GITHUB_WORKSPACE/.coursier-cache-custom"
      - id: action
        uses: .
        with:
          job: test-custom-path
          path: ${{ github.workspace }}/.coursier-cache-custom
      - name: Assert action completed with custom path
        env:
          CACHE_HIT_COURSIER: ${{ steps.action.outputs.cache-hit-coursier }}
        run: |
          echo "cache-hit-coursier: $CACHE_HIT_COURSIER"
          # Action should complete without error; output is true/false/empty
          if [ "$CACHE_HIT_COURSIER" = "true" ] || [ "$CACHE_HIT_COURSIER" = "false" ] || [ -z "$CACHE_HIT_COURSIER" ]; then
            echo "PASS: action completed with custom path, cache-hit-coursier='$CACHE_HIT_COURSIER'"
          else
            echo "FAIL: unexpected value for cache-hit-coursier: '$CACHE_HIT_COURSIER'"
            exit 1
          fi
