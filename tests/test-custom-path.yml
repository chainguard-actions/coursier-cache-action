name: Test custom cache path
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create custom cache directory
        run: mkdir -p "$GITHUB_WORKSPACE/custom-coursier-cache"
      - id: cache
        uses: .
        with:
          job: test-custom-path
          path: ${{ github.workspace }}/custom-coursier-cache
      - name: Assert cache-hit-coursier output is valid
        env:
          CACHE_HIT: ${{ steps.cache.outputs.cache-hit-coursier }}
        run: |
          echo "cache-hit-coursier: '$CACHE_HIT'"
          if [ "$CACHE_HIT" = "true" ] || [ "$CACHE_HIT" = "false" ] || [ -z "$CACHE_HIT" ]; then
            echo "PASS: cache-hit-coursier is a valid value"
          else
            echo "FAIL: unexpected value for cache-hit-coursier: '$CACHE_HIT'"
            exit 1
          fi
      - name: Assert custom cache directory exists
        run: |
          if [ -d "$GITHUB_WORKSPACE/custom-coursier-cache" ]; then
            echo "PASS: custom cache directory exists"
          else
            echo "FAIL: custom cache directory not found"
            exit 1
          fi
