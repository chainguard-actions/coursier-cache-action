name: Test custom cache path and ignore flags
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create minimal sbt build definition
        run: |
          mkdir -p project
          echo 'sbt.version=1.9.0' > project/build.properties
          echo '// empty build' > build.sbt
          mkdir -p /tmp/coursier-cache

      - id: action
        uses: .
        continue-on-error: true
        with:
          path: '/tmp/coursier-cache'
          ignoreJob: 'true'
          ignoreMatrix: 'true'

      - name: Assert action ran or failed gracefully
        env:
          OUTCOME: ${{ steps.action.outcome }}
          CACHE_HIT_COURSIER: ${{ steps.action.outputs.cache-hit-coursier }}
        run: |
          echo "outcome: $OUTCOME"
          echo "cache-hit-coursier: $CACHE_HIT_COURSIER"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded with custom path and ignore flags"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (cache service may not be available under act)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
