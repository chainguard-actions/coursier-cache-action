name: Test sbt project in sub-directory root
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          root: tests/fixtures/sbt-project
          extraKey: sbt-root-test
      - name: Assert coursier and sbt outputs set, mill/ammonite not
        env:
          CS: ${{ steps.action.outputs.cache-hit-coursier }}
          SBT: ${{ steps.action.outputs.cache-hit-sbt-ivy2-cache }}
          MILL: ${{ steps.action.outputs.cache-hit-mill }}
          AMM: ${{ steps.action.outputs.cache-hit-ammonite }}
        run: |
          echo "coursier: $CS sbt: $SBT mill: '$MILL' ammonite: '$AMM'"
          for v in "$CS" "$SBT"; do
            if [ "$v" != "true" ] && [ "$v" != "false" ]; then
              echo "FAIL: expected boolean output, got '$v'"
              exit 1
            fi
          done
          if [ -n "$MILL" ]; then
            echo "FAIL: mill cache should not be handled for an sbt-only project"
            exit 1
          fi
          if [ -n "$AMM" ]; then
            echo "FAIL: ammonite cache should not be handled without .sc scripts"
            exit 1
          fi
          echo "PASS"
